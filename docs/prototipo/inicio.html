<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Mapa de Pensum · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Plan: una portada inmersiva por carrera (campo de color + tu pensum como constelación),
   el nombre grande sobre un fundido desenfocado, una acción, tres cifras; debajo, las nueve
   en listas agrupadas. Cristal vivo solo en lo que flota (cabecera al deslizar, muelle, hojas). */
:root {
  --lienzo: #050507; --superficie: rgb(255 255 255 / .055); --filo: rgb(255 255 255 / .09);
  --tinta: #F5F6F8; --suave: #C4C8CF; --tenue: #8E949D; --apagada: #5B616A;
  --t: 255 255 255; --l: 5 5 7;
  --vidrio: rgb(22 23 27 / .58);
  --display: 'Jost', 'Futura', 'Avenir Next', system-ui, sans-serif;
  --texto: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --resorte: cubic-bezier(.2, .9, .25, 1.15);
  --suave-out: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
.app.claro {
  --lienzo: #F5F5F7; --superficie: #FFFFFF; --filo: rgb(11 12 15 / .07);
  --tinta: #0B0C0F; --suave: #3A3D43; --tenue: #6B6F76; --apagada: #A0A3A9;
  --t: 11 12 15; --l: 245 245 247;
  --vidrio: rgb(250 250 252 / .66);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #050507; }
body { font-family: var(--texto); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid #6094ff; outline-offset: 3px; }

/* El marco: a pantalla completa en el móvil; en un escritorio, un teléfono en el centro */
.escena { height: 100%; display: grid; place-items: center; background: radial-gradient(80% 60% at 50% 0%, #15171c, #050507); }
.app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--lienzo); color: var(--tinta); transition: background-color .5s; isolation: isolate; }
@media (min-width: 560px) {
  .app { width: 390px; height: min(844px, calc(100% - 48px)); border-radius: 48px; box-shadow: 0 0 0 10px #101114, 0 0 0 11px #2a2c31, 0 40px 80px -20px rgb(0 0 0 / .8); }
}

.vista { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
.vista::-webkit-scrollbar { display: none; }
.vista[hidden] { display: none; }

/* ============ Texto ============ */
.rot { font: 500 11px/16px var(--texto); letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); font-variant-numeric: tabular-nums; }
.nota { font: 400 13px/18px var(--texto); letter-spacing: -.003em; color: var(--tenue); font-variant-numeric: tabular-nums; }

/* ============ Iconos ============ */
.ph { width: var(--s, 22px); height: var(--s, 22px); display: block; flex: none; }
.ph [opacity] { opacity: .32; }

/* ============ Cabecera: sin logo, el saludo y los ajustes; al deslizar se vuelve vidrio ============ */
.cabecera { position: absolute; z-index: 30; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
.cabecera > * { pointer-events: auto; }
.cabecera::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--vidrio); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); box-shadow: 0 1px 0 var(--filo); opacity: 0; transition: opacity .25s; }
.cabecera.solida::before { opacity: 1; }
.saludo { flex: 1; min-width: 0; display: flex; flex-direction: column; transition: opacity .2s; }
.saludo b { font: 500 15px/20px var(--texto); letter-spacing: -.01em; color: var(--tinta); }
.saludo span { font: 400 13px/16px var(--texto); color: rgb(var(--t) / .62); }
.titulo-mini { position: absolute; left: 0; right: 0; text-align: center; font: 500 16px/20px var(--texto); letter-spacing: -.01em; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .3s var(--suave-out); pointer-events: none; }
.cabecera.solida .titulo-mini { opacity: 1; transform: none; }
.cabecera.solida .saludo { opacity: 0; }
.circulo { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; flex: none; position: relative;
  background: rgb(var(--t) / .1); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: inset 0 0 0 1px rgb(var(--t) / .1), inset 0 1px 0 rgb(var(--t) / .14); transition: transform .35s var(--resorte); }
.app.claro .circulo { background: rgb(255 255 255 / .7); box-shadow: inset 0 0 0 1px rgb(var(--t) / .06), 0 1px 2px rgb(0 0 0 / .06); }
.circulo:active, .pulsable:active { transform: scale(.94); transition-duration: .12s; }

/* ============ La portada inmersiva ============ */
.portada { position: relative; padding-top: calc(env(safe-area-inset-top) + 112px); }
.lienzo-portada { position: absolute; inset: 0 0 auto 0; height: 470px; overflow: hidden; z-index: 0; }
.lienzo-portada canvas { position: absolute; inset: -6%; width: 112%; height: 112%; animation: deriva 22s ease-in-out infinite alternate; }
@keyframes deriva { to { transform: translate3d(-3%, 2%, 0) scale(1.04); } }
.lienzo-portada::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 230px;
  -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  -webkit-mask-image: linear-gradient(transparent, #000 55%); mask-image: linear-gradient(transparent, #000 55%);
  background: linear-gradient(rgb(var(--l) / 0), rgb(var(--l) / .55) 45%, rgb(var(--l) / 1)); }
.portada-cuerpo { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 0 20px; text-align: center; }
.tecla { display: grid; place-items: center; color: #fff; position: relative; flex: none;
  background: radial-gradient(120% 120% at 30% 0%, color-mix(in srgb, var(--k) 100%, #fff 28%), var(--k) 45%, color-mix(in srgb, var(--k) 62%, #000));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .38), inset 0 0 0 1px rgb(255 255 255 / .16), inset 0 -8px 16px -8px rgb(0 0 0 / .35); }
.tecla.grande { width: 84px; height: 84px; border-radius: 26px; --s: 44px; box-shadow: inset 0 1px 0 rgb(255 255 255 / .4), inset 0 0 0 1px rgb(255 255 255 / .18), inset 0 -12px 24px -10px rgb(0 0 0 / .35), 0 24px 48px -16px color-mix(in srgb, var(--k) 75%, transparent); }
.tecla.grande .ph [opacity] { opacity: .5; }
.nombre { font: 300 46px/50px var(--display); letter-spacing: -.025em; margin-top: 22px; text-wrap: balance; }
.sub { font: 400 15px/20px var(--texto); color: var(--tenue); margin-top: 6px; }
.acciones { display: flex; gap: 10px; width: 100%; margin-top: 24px; }
.pildora { flex: 1; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 16px/20px var(--texto); letter-spacing: -.01em; background: var(--tinta); color: var(--lienzo); transition: transform .35s var(--resorte); --s: 18px; }
.pildora.vidrio { background: rgb(var(--t) / .1); color: var(--tinta); box-shadow: inset 0 0 0 1px rgb(var(--t) / .1); }
.app.claro .pildora.vidrio { background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .06), inset 0 0 0 1px rgb(var(--t) / .05); }
.acciones .circulo { width: 52px; height: 52px; border-radius: 26px; }
.cifras { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 28px; }
.cifras > div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cifra { font: 300 28px/1 var(--texto); font-variation-settings: 'opsz' 32; letter-spacing: -.025em; font-variant-numeric: tabular-nums; display: inline-flex; align-items: baseline; height: 30px; }
.cifra small { font-size: 15px; font-weight: 400; color: var(--tenue); margin-left: 2px; letter-spacing: 0; }
/* La regla de semestres: un trazo por semestre, como una escala técnica */
.regla { width: 100%; margin-top: 28px; padding: 16px 16px 14px; border-radius: 20px; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--filo); }
.app.claro .regla { box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
.regla-cab { display: flex; justify-content: space-between; align-items: baseline; }
.marcas { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 14px; align-items: end; }
.marcas > i { justify-self: center; width: 4px; height: 24px; border-radius: 2px; background: rgb(var(--t) / .12); position: relative; transform-origin: bottom; animation: crece .7s var(--suave-out) backwards; }
.marcas > i.ok { background: var(--tinta); }
.marcas > i.va { background: linear-gradient(var(--k) var(--p), rgb(var(--t) / .12) var(--p)); background: linear-gradient(to top, var(--k) var(--p), rgb(var(--t) / .12) var(--p)); }
.marcas > i.va::after { content: ''; position: absolute; left: 50%; top: -9px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--k); box-shadow: 0 0 8px var(--k); }
@keyframes crece { from { transform: scaleY(.15); opacity: 0; } }
.numeros { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 8px; }
.numeros > span { font: 500 11px/14px var(--texto); color: var(--apagada); text-align: center; font-variant-numeric: tabular-nums; }
.numeros > span.on { color: var(--tinta); }

/* El odómetro */
.rueda { display: inline-block; height: 1em; overflow: hidden; line-height: 1; vertical-align: baseline; }
.rueda > span { display: flex; flex-direction: column; transition: transform 1.1s var(--suave-out); }
.rueda > span > span { height: 1em; line-height: 1; }

/* ============ Las carreras ============ */
.seccion { padding: 36px 16px 0; }
.seccion-cab { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 10px; }
.seccion-cab h2 { font: 400 22px/28px var(--display); letter-spacing: -.015em; }
.grupo-rot { padding: 18px 4px 8px; }
.grupo { border-radius: 22px; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--filo); overflow: hidden; }
.app.claro .grupo { box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 10px 30px -18px rgb(20 30 60 / .18); }
.fila { width: 100%; min-height: 64px; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 12px; text-align: left; position: relative; transition: background-color .2s; }
.fila:active { background: rgb(var(--t) / .05); }
.fila + .fila::before { content: ''; position: absolute; top: 0; left: 70px; right: 0; height: 1px; background: var(--filo); }
.fila .tecla { width: 44px; height: 44px; border-radius: 13px; --s: 24px; }
.fila .nm { flex: 1; min-width: 0; }
.fila .nm b { display: block; font: 500 16px/21px var(--texto); letter-spacing: -.012em; }
.fila .flecha { color: var(--apagada); --s: 16px; }
.tuya { font: 500 12px/16px var(--texto); padding: 4px 10px; border-radius: 10px; background: rgb(var(--t) / .08); color: var(--suave); }
.pie { padding: 28px 20px calc(env(safe-area-inset-bottom) + 120px); text-align: center; }

/* ============ El muelle (Liquid Glass en la app, con Haze de respaldo) ============ */
.muelle { position: absolute; z-index: 40; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; gap: 10px; transition: transform .45s var(--suave-out), opacity .3s; }
.muelle.oculto { transform: translateY(140%); opacity: 0; }
.capsula, .lupa { position: relative; height: 62px; border-radius: 31px; background: var(--vidrio);
  -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7);
  box-shadow: inset 0 0 0 1px rgb(var(--t) / .1), inset 0 1px 0 rgb(var(--t) / .16), 0 16px 40px -12px rgb(0 0 0 / .6); }
.app.claro .capsula, .app.claro .lupa { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .8), 0 1px 2px rgb(0 0 0 / .06), 0 16px 40px -16px rgb(20 30 60 / .3); }
.capsula { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); padding: 5px; }
.lupa { width: 62px; flex: none; display: grid; place-items: center; transition: transform .35s var(--resorte); }
.lupa:active { transform: scale(.92); }
.pestana { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 10.5px/12px var(--texto); color: var(--tenue); transition: color .25s; }
.pestana.on { color: var(--tinta); }
.pestana .ph { --s: 23px; }
.indicador { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 26px; background: rgb(var(--t) / .11); box-shadow: inset 0 1px 0 rgb(var(--t) / .1); transition: transform .5s var(--resorte); }
.app.claro .indicador { background: rgb(var(--t) / .06); }

/* ============ Ficha de una carrera ============ */
.atras { position: absolute; z-index: 30; top: calc(env(safe-area-inset-top) + 12px); left: 16px; }
.pensum { width: 100%; margin-top: 28px; padding: 18px 16px; border-radius: 20px; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--filo); text-align: left; }
.puntos { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 14px; }
.puntos > div { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.puntos i { width: 7px; height: 7px; border-radius: 50%; background: var(--k); opacity: .85; }

/* ============ Búsqueda, hoja de ajustes y aviso ============ */
.velo { position: absolute; inset: 0; z-index: 50; background: rgb(0 0 0 / .4); opacity: 0; pointer-events: none; transition: opacity .3s; }
.velo.on { opacity: 1; pointer-events: auto; }
.busqueda { position: absolute; inset: 0; z-index: 55; background: rgb(var(--l) / .72); -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5); padding: calc(env(safe-area-inset-top) + 14px) 16px 0; opacity: 0; pointer-events: none; transition: opacity .25s; overflow-y: auto; }
.busqueda.on { opacity: 1; pointer-events: auto; }
.campo { display: flex; gap: 10px; align-items: center; }
.campo label { flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: rgb(var(--t) / .09); box-shadow: inset 0 0 0 1px rgb(var(--t) / .08); color: var(--tenue); }
.campo input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font: 400 16px/20px var(--texto); color: var(--tinta); }
.campo input::placeholder { color: var(--tenue); }
.busqueda .grupo { margin-top: 18px; }
.vacio { padding: 40px 0; text-align: center; }
.hoja { position: absolute; z-index: 60; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); border-radius: 32px; padding: 10px 16px 18px; background: var(--vidrio); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); box-shadow: inset 0 0 0 1px rgb(var(--t) / .1), 0 30px 60px -20px rgb(0 0 0 / .6); transform: translateY(115%); transition: transform .5s var(--suave-out); }
.hoja.on { transform: none; }
.asa { width: 36px; height: 5px; border-radius: 3px; background: rgb(var(--t) / .25); margin: 0 auto 14px; }
.hoja h3 { font: 400 22px/28px var(--display); padding: 0 4px 14px; }
.segmento { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 16px; background: rgb(var(--t) / .08); position: relative; }
.segmento button { height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px/18px var(--texto); color: var(--tenue); position: relative; z-index: 1; --s: 18px; transition: color .2s; }
.segmento button[aria-pressed="true"] { color: var(--tinta); }
.segmento .indicador { top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 2); border-radius: 12px; background: rgb(var(--t) / .14); }
.app.claro .segmento .indicador { background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
.aviso { position: absolute; z-index: 70; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translate(-50%, 20px); opacity: 0; padding: 12px 18px; border-radius: 22px; font: 500 14px/18px var(--texto); white-space: nowrap; background: var(--vidrio); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: inset 0 0 0 1px rgb(var(--t) / .1), 0 12px 30px -10px rgb(0 0 0 / .5); transition: transform .4s var(--resorte), opacity .25s; pointer-events: none; }
.aviso.on { transform: translate(-50%, 0); opacity: 1; }

/* Entrada: desde un estado visible, solo transformación */
.entra { animation: entra .7s var(--suave-out) backwards; }
@keyframes entra { from { transform: translateY(14px) scale(.98); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .32s; }
::view-transition-group(tecla) { animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .9, .25, 1.05); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="escena">
<div class="app" id="app">

  <section class="vista" id="inicio" aria-label="Inicio">
    <div class="portada" id="portada">
      <div class="lienzo-portada"><canvas id="lienzo"></canvas></div>
      <div class="portada-cuerpo" id="portada-cuerpo"></div>
    </div>
    <div class="seccion">
      <div class="seccion-cab"><h2>Carreras</h2><span class="nota">UDO Monagas</span></div>
      <div id="listas"></div>
    </div>
    <div class="pie nota">Prototipo de Mapa de Pensum · datos de ejemplo</div>
  </section>

  <section class="vista" id="detalle" aria-label="Carrera" hidden></section>

  <header class="cabecera" id="cabecera">
    <div class="saludo"><b id="saludo">Buenas tardes</b><span id="fecha"></span></div>
    <div class="titulo-mini" id="titulo-mini"></div>
    <button class="circulo" id="abrir-ajustes" aria-label="Ajustes"><svg class="ph" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="--s:21px"><path fill="currentColor" d="M128 80a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 80a32 32 0 1 1 32-32a32 32 0 0 1-32 32m109.94-52.79a8 8 0 0 0-3.89-5.4l-29.83-17l-.12-33.62a8 8 0 0 0-2.83-6.08a111.9 111.9 0 0 0-36.72-20.67a8 8 0 0 0-6.46.59L128 41.85L97.88 25a8 8 0 0 0-6.47-.6a112.1 112.1 0 0 0-36.68 20.75a8 8 0 0 0-2.83 6.07l-.15 33.65l-29.83 17a8 8 0 0 0-3.89 5.4a106.5 106.5 0 0 0 0 41.56a8 8 0 0 0 3.89 5.4l29.83 17l.12 33.62a8 8 0 0 0 2.83 6.08a111.9 111.9 0 0 0 36.72 20.67a8 8 0 0 0 6.46-.59L128 214.15L158.12 231a7.9 7.9 0 0 0 3.9 1a8.1 8.1 0 0 0 2.57-.42a112.1 112.1 0 0 0 36.68-20.73a8 8 0 0 0 2.83-6.07l.15-33.65l29.83-17a8 8 0 0 0 3.89-5.4a106.5 106.5 0 0 0-.03-41.52m-15 34.91l-28.57 16.25a8 8 0 0 0-3 3c-.58 1-1.19 2.06-1.81 3.06a7.94 7.94 0 0 0-1.22 4.21l-.15 32.25a95.9 95.9 0 0 1-25.37 14.3L134 199.13a8 8 0 0 0-3.91-1h-3.83a8.1 8.1 0 0 0-4.1 1l-28.84 16.1A96 96 0 0 1 67.88 201l-.11-32.2a8 8 0 0 0-1.22-4.22c-.62-1-1.23-2-1.8-3.06a8.1 8.1 0 0 0-3-3.06l-28.6-16.29a90.5 90.5 0 0 1 0-28.26l28.52-16.28a8 8 0 0 0 3-3c.58-1 1.19-2.06 1.81-3.06a7.94 7.94 0 0 0 1.22-4.21l.15-32.25a95.9 95.9 0 0 1 25.37-14.3L122 56.87a8 8 0 0 0 4.1 1h3.64a8.1 8.1 0 0 0 4.1-1l28.84-16.1A96 96 0 0 1 188.12 55l.11 32.2a8 8 0 0 0 1.22 4.22c.62 1 1.23 2 1.8 3.06a8.1 8.1 0 0 0 3 3.06l28.6 16.29a90.5 90.5 0 0 1 .05 28.29Z"/></svg></button>
  </header>

  <nav class="muelle" id="muelle" aria-label="Secciones">
    <div class="capsula">

  { slug: 'sistemas', corto: 'Sistemas', nombre: 'Ingeniería de Sistemas', tipo: 'Ingeniería', osc: '#6094ff', cla: '#2751cc', ic: 'cpu', sil: [6,5,6,6,7,6,5,5,2,1], mat: 49, uc: 132 },
  { slug: 'agronomica', corto: 'Agronómica', nombre: 'Ingeniería Agronómica', tipo: 'Ingeniería', osc: '#3fcb74', cla: '#1b7a44', ic: 'grains', sil: [9,7,7,6,6,6,5,6,3,3], mat: 58, uc: 150 },
  { slug: 'ambiental', corto: 'Ambiental', nombre: 'Ingeniería Ambiental', tipo: 'Ingeniería', osc: '#34c6ea', cla: '#0b7391', ic: 'tree', sil: [8,6,7,7,5,6,4,5,5,2], mat: 55, uc: 153 },
  { slug: 'petroleo', corto: 'Petróleo', nombre: 'Ingeniería de Petróleo', tipo: 'Ingeniería', osc: '#e8a33d', cla: '#9a6410', ic: 'drop-half-bottom', sil: [7,5,7,5,5,6,4,6,5,3], mat: 53, uc: 150 },
  { slug: 'animal', corto: 'Producción Animal', nombre: 'Ingeniería en Producción Animal', tipo: 'Ingeniería', osc: '#a9c23f', cla: '#5f7a16', ic: 'cow', sil: [8,7,6,7,6,5,5,6,7,3], mat: 60, uc: 160 },
  { slug: 'administracion', corto: 'Administración', nombre: 'Licenciatura en Administración', tipo: 'Licenciatura', osc: '#8a7cf0', cla: '#4b3bc4', ic: 'presentation-chart', sil: [7,6,6,5,6,5,5,5,6,5], mat: 56, uc: 155 },
  { slug: 'contaduria', corto: 'Contaduría', nombre: 'Licenciatura en Contaduría Pública', tipo: 'Licenciatura', osc: '#2fd3c0', cla: '#0a8577', ic: 'calculator', sil: [7,6,6,5,5,6,5,6,6,4], mat: 56, uc: 155 },
  { slug: 'alimentos', corto: 'Alimentos', nombre: 'Licenciatura en Tecnología de los Alimentos', tipo: 'Licenciatura', osc: '#ff7a6b', cla: '#c03a2b', ic: 'flask', sil: [7,5,4,5,5,5,4,4,3,3], mat: 45, uc: 140 },
  { slug: 'rrhh', corto: 'Recursos Humanos', nombre: 'Gerencia de Recursos Humanos', tipo: 'Licenciatura', osc: '#f072b0', cla: '#b32c74', ic: 'users-three', sil: [6,5,5,5,5,4,5,5,5,4], mat: 49, uc: 149 },
];
const porSlug = s => CARRERAS.find(k => k.slug === s);
/* Avance de ejemplo: en Sistemas, cuatro semestres aprobados y dos materias del quinto en curso */
const AVANCE = { sistemas: { aprobados: 4, cursando: 2, pct: 41, inscribir: 6, grado: 'Dic 2029' } };

const app = document.getElementById('app');
const estado = { mia: 'sistemas', claro: false, vista: 'inicio', abierta: null };
try { const g = JSON.parse(localStorage.getItem('mp-proto') || '{}'); Object.assign(estado, { mia: g.mia || 'sistemas', claro: !!g.claro }); } catch (e) {}
const guardar = () => { try { localStorage.setItem('mp-proto', JSON.stringify({ mia: estado.mia, claro: estado.claro })); } catch (e) {} };
const color = k => estado.claro ? k.cla : k.osc;
const toque = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

/* ---------- Saludo según la hora ---------- */
function saludar() {
  const h = new Date().getHours();
  document.getElementById('saludo').textContent = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('fecha').textContent = new Date().toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, c => c.toUpperCase());
}

/* ---------- La portada: campo de color + tu pensum como constelación, pintado una vez ---------- */
const hexHsl = hex => { const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; if (!d) return [0, 0, l * 100]; const s = d / (1 - Math.abs(2 * l - 1)); let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(h * 60 + 360) % 360, s * 100, l * 100]; };
const hsla = (h, s, l, a) => `hsla(${(h + 360) % 360}, ${s}%, ${l}%, ${a})`;
let grano;
function texturaGrano() {
  if (grano) return grano;
  grano = document.createElement('canvas'); grano.width = grano.height = 128;
  const c = grano.getContext('2d'), img = c.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  c.putImageData(img, 0, 0); return grano;
}
function pintarPortada(k, cv = document.getElementById('lienzo')) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [hu, sa, li] = hexHsl(k.osc), claro = estado.claro;
  c.fillStyle = claro ? '#F5F5F7' : '#050507'; c.fillRect(0, 0, w, h);
  const manchas = [
    [w * .18, h * .22, w * .95, hu, claro ? .55 : .95, claro ? 72 : 52],
    [w * 1.0, h * .08, w * .75, hu + 42, claro ? .4 : .7, claro ? 75 : 50],
    [w * .7, h * .62, w * .7, hu - 38, claro ? .3 : .55, claro ? 78 : 42],
    [w * .1, h * .75, w * .5, hu + 18, claro ? .2 : .35, claro ? 80 : 36],
  ];
  for (const [x, y, r, tono, a, luz] of manchas) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, hsla(tono, Math.min(sa, 90), luz, a)); g.addColorStop(.55, hsla(tono, Math.min(sa, 90), luz, a * .35)); g.addColorStop(1, hsla(tono, sa, luz, 0));
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }
  /* El pensum como constelación: un punto por materia, una columna por semestre */
  const av = AVANCE[k.slug] && k.slug === estado.mia ? AVANCE[k.slug] : null;
  const cols = k.sil.length, paso = (w - 40) / cols, alto = Math.max(...k.sil), py = Math.min(24, (h * .5) / alto), y0 = 96;
  k.sil.forEach((n, i) => {
    for (let j = 0; j < n; j++) {
      const x = 20 + paso * (i + .5), y = y0 + py * (j + .5);
      const hecho = av && i < av.aprobados, curso = av && i === av.aprobados && j < av.cursando;
      c.beginPath(); c.arc(x, y, hecho ? 2.6 : 2, 0, Math.PI * 2);
      if (curso) { c.strokeStyle = claro ? 'rgba(11,12,15,.5)' : 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.stroke(); }
      else { c.fillStyle = claro ? `rgba(11,12,15,${hecho ? .26 : .07})` : `rgba(255,255,255,${hecho ? .42 : .1})`; c.fill(); }
    }
  });
  c.globalAlpha = claro ? .05 : .07; c.globalCompositeOperation = claro ? 'multiply' : 'overlay';
  c.fillStyle = c.createPattern(texturaGrano(), 'repeat'); c.fillRect(0, 0, w, h);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

/* ---------- Odómetro ---------- */
function odometro(texto) {
  return [...texto].map(ch => /\d/.test(ch) ? `<span class="rueda"><span data-d="${ch}">${[...'0123456789'].map(d => `<span>${d}</span>`).join('')}</span></span>` : `<span>${ch}</span>`).join('');
}
function rodar(raiz) {
  requestAnimationFrame(() => requestAnimationFrame(() => raiz.querySelectorAll('[data-d]').forEach((el, i) => { el.style.transitionDelay = (i * 70) + 'ms'; el.style.transform = `translateY(-${el.dataset.d}em)`; })));
}

/* ---------- Inicio ---------- */
function renderPortada(animar = true) {
  const k = porSlug(estado.mia), av = AVANCE[k.slug];
  app.style.setProperty('--k', color(k));
  const a = av || { aprobados: 0, cursando: 0, pct: 0, inscribir: k.sil[0], grado: 'Jul 2031' };
  const marcas = k.sil.map((_, i) => i < a.aprobados ? '<i class="ok"></i>' : i === a.aprobados && a.cursando ? `<i class="va" style="--p:${Math.round(100 * a.cursando / k.sil[i])}%"></i>` : '<i></i>').join('');
  const actual = Math.min(a.aprobados + 1, 10);
  document.getElementById('portada-cuerpo').innerHTML = `
    <span class="tecla grande entra" id="tecla-mia" style="--k:${color(k)}">${ico(k.ic, 'fill')}</span>
    <h1 class="nombre">${k.corto}</h1>
    <p class="sub">${k.tipo}</p>
    <div class="acciones">
      <button class="pildora pulsable" data-aviso="${av ? 'Abre tu mapa donde lo dejaste' : 'Marca lo que ya aprobaste'}">${av ? 'Seguir donde ibas' : 'Empezar'} ${ico('arrow-right', 'regular')}</button>
      <button class="circulo pulsable" aria-label="Horario" data-aviso="Abre tu horario de esta semana">${ico('calendar-blank', 'regular', 22)}</button>
    </div>
    <div class="cifras">
      <div><span class="cifra">${odometro(String(a.pct))}<small>%</small></span><span class="nota">Avance</span></div>
      <div><span class="cifra">${odometro(String(a.inscribir))}</span><span class="nota">Por inscribir</span></div>
      <div><span class="cifra">${a.grado}</span><span class="nota">Te gradúas</span></div>
    </div>
    <div class="regla" style="--k:${color(k)}">
      <div class="regla-cab"><span class="rot">Semestres</span><span class="nota"><b style="color:var(--tinta);font-weight:500">${actual}</b> de 10</span></div>
      <div class="marcas">${marcas}</div>
      <div class="numeros">${k.sil.map((_, i) => `<span class="${i + 1 === actual ? 'on' : ''}">${i + 1}</span>`).join('')}</div>
    </div>`;
  document.querySelectorAll('.marcas > i').forEach((m, i) => m.style.animationDelay = (200 + i * 40) + 'ms');
  document.getElementById('titulo-mini').textContent = k.corto;
  pintarPortada(k);
  if (animar) rodar(document.getElementById('portada-cuerpo')); else document.querySelectorAll('#portada-cuerpo [data-d]').forEach(el => { el.style.transition = 'none'; el.style.transform = `translateY(-${el.dataset.d}em)`; });
}
const fila = k => `<button class="fila" data-slug="${k.slug}">
  <span class="tecla" style="--k:${color(k)}">${ico(k.ic, 'duotone')}</span>
  <span class="nm"><b>${k.corto}</b><span class="nota">${k.mat} materias</span></span>
  ${k.slug === estado.mia ? '<span class="tuya">Tuya</span>' : ''}<span class="flecha">${ico('caret-right')}</span></button>`;
function renderListas() {
  const tipos = [['Ingenierías', 'Ingeniería'], ['Licenciaturas', 'Licenciatura']];
  document.getElementById('listas').innerHTML = tipos.map(([t, tipo]) => {
    const ks = CARRERAS.filter(k => k.tipo === tipo);
    return `<div class="grupo-rot rot">${t}</div><div class="grupo">${ks.map(fila).join('')}</div>`;
  }).join('');
}

/* ---------- Ficha de una carrera ---------- */
function renderDetalle(k) {
  const d = document.getElementById('detalle'), esMia = k.slug === estado.mia;
  d.style.setProperty('--k', color(k));
  d.innerHTML = `<button class="circulo atras" id="volver" aria-label="Volver">${ico('caret-left', 'regular', 20)}</button>
  <div class="portada"><div class="lienzo-portada"><canvas id="lienzo-d"></canvas></div>
  <div class="portada-cuerpo">
    <span class="tecla grande" style="--k:${color(k)};view-transition-name:tecla">${ico(k.ic, 'fill')}</span>
    <h1 class="nombre">${k.corto}</h1>
    <p class="sub">${k.nombre}</p>
    <div class="acciones">
      <button class="pildora pulsable" data-aviso="Abre el mapa de ${k.corto}">Ver el mapa ${ico('arrow-right', 'regular')}</button>
      ${esMia ? '' : `<button class="pildora vidrio pulsable" id="hacer-mia" style="flex:.8">Hacerla mía</button>`}
    </div>
    <div class="cifras">
      <div><span class="cifra">${k.mat}</span><span class="nota">Materias</span></div>
      <div><span class="cifra">${k.uc}</span><span class="nota">UC</span></div>
      <div><span class="cifra">10</span><span class="nota">Semestres</span></div>
    </div>
    <div class="pensum">
      <div class="regla-cab"><span class="rot">El pensum</span><span class="nota">Un punto por materia</span></div>
      <div class="puntos">${k.sil.map(n => `<div>${'<i></i>'.repeat(n)}</div>`).join('')}</div>
      <div class="numeros">${k.sil.map((_, i) => `<span>${i + 1}</span>`).join('')}</div>
    </div>
  </div></div><div class="pie"></div>`;
  if (!d.hidden) pintarPortada(k, document.getElementById('lienzo-d'));
}

/* ---------- Navegación con transición de vista (Chrome) ---------- */
function transicion(cambio) { if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(cambio); else cambio(); }
function abrirCarrera(slug, origen) {
  toque();
  const k = porSlug(slug);
  if (origen) origen.querySelector('.tecla').style.viewTransitionName = 'tecla';
  transicion(() => {
    if (origen) origen.querySelector('.tecla').style.viewTransitionName = '';
    renderDetalle(k);
    document.getElementById('inicio').hidden = true;
    const d = document.getElementById('detalle'); d.hidden = false; d.scrollTop = 0;
    pintarPortada(k, document.getElementById('lienzo-d'));
    document.getElementById('cabecera').style.display = 'none';
    document.getElementById('muelle').classList.add('oculto');
    estado.vista = 'detalle'; estado.abierta = slug;
  });
}
function volver() {
  toque();
  const slug = estado.abierta;
  transicion(() => {
    document.getElementById('detalle').hidden = true;
    document.getElementById('inicio').hidden = false;
    document.getElementById('cabecera').style.display = '';
    document.getElementById('muelle').classList.remove('oculto');
    const t = document.querySelector(`#listas [data-slug="${slug}"] .tecla`); if (t) t.style.viewTransitionName = 'tecla';
    estado.vista = 'inicio';
  });
  setTimeout(() => document.querySelectorAll('#listas .tecla').forEach(t => t.style.viewTransitionName = ''), 600);
}
function hacerMia(slug) {
  estado.mia = slug; guardar(); toque();
  transicion(() => {
    document.getElementById('detalle').hidden = true;
    const i = document.getElementById('inicio'); i.hidden = false; i.scrollTop = 0;
    document.getElementById('cabecera').style.display = '';
    document.getElementById('muelle').classList.remove('oculto');
    renderPortada(); renderListas(); estado.vista = 'inicio';
  });
  avisar('Ahora ' + porSlug(slug).corto + ' es tu carrera');
}

/* ---------- Avisos, ajustes, búsqueda ---------- */
let reloj;
function avisar(t) { const a = document.getElementById('aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(reloj); reloj = setTimeout(() => a.classList.remove('on'), 1900); }
function tema(claro) {
  estado.claro = claro; guardar();
  app.classList.toggle('claro', claro);
  document.querySelector('meta[name="theme-color"]').content = claro ? '#F5F5F7' : '#050507';
  document.getElementById('tema-oscuro').setAttribute('aria-pressed', !claro);
  document.getElementById('tema-claro').setAttribute('aria-pressed', claro);
  document.querySelector('#tema .indicador').style.transform = claro ? 'translateX(100%)' : '';
  renderPortada(false); renderListas();
  if (estado.vista === 'detalle') renderDetalle(porSlug(estado.abierta));
}
function hoja(on) { document.getElementById('hoja').classList.toggle('on', on); document.getElementById('velo').classList.toggle('on', on); }
function buscar(q) {
  const n = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const r = CARRERAS.filter(k => n(k.nombre + ' ' + k.corto).includes(n(q)));
  document.getElementById('resultados').innerHTML = r.length ? `<div class="grupo">${r.map(fila).join('')}</div>` : `<p class="vacio nota">Ninguna carrera se llama así</p>`;
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const f = e.target.closest('.fila[data-slug]');
  if (f) { if (document.getElementById('busqueda').classList.contains('on')) cerrarBusqueda(); abrirCarrera(f.dataset.slug, f.closest('#listas') ? f : null); return; }
  const av = e.target.closest('[data-aviso]'); if (av) { toque(); avisar(av.dataset.aviso); if (av.closest('.hoja')) hoja(false); return; }
  if (e.target.closest('#volver')) return volver();
  if (e.target.closest('#hacer-mia')) return hacerMia(estado.abierta);
  const p = e.target.closest('.pestana');
  if (p) {
    toque();
    document.querySelectorAll('.pestana').forEach(x => { const on = x === p; x.classList.toggle('on', on); x.querySelector('svg').outerHTML = ico(x.dataset.ic, on ? 'fill' : 'regular'); });
    document.getElementById('indicador').style.transform = `translateX(${p.dataset.i * 100}%)`;
    if (p.dataset.i !== '0') { avisar(['', 'El mapa', 'Por hacer', 'El horario'][p.dataset.i] + ' de ' + porSlug(estado.mia).corto + ', en la app'); setTimeout(() => document.querySelector('.pestana[data-i="0"]').click(), 1400); }
  }
});
document.getElementById('abrir-ajustes').onclick = () => { toque(); hoja(true); };
document.getElementById('velo').onclick = () => hoja(false);
document.getElementById('tema-oscuro').onclick = () => { toque(); tema(false); };
document.getElementById('tema-claro').onclick = () => { toque(); tema(true); };
const cerrarBusqueda = () => { document.getElementById('busqueda').classList.remove('on'); document.getElementById('q').blur(); };
document.getElementById('abrir-busqueda').onclick = () => { toque(); const b = document.getElementById('busqueda'); b.classList.add('on'); const q = document.getElementById('q'); q.value = ''; buscar(''); setTimeout(() => q.focus(), 60); };
document.getElementById('cerrar-busqueda').onclick = cerrarBusqueda;
document.getElementById('q').oninput = e => buscar(e.target.value);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { cerrarBusqueda(); hoja(false); } });

/* Al deslizar: la cabecera se vuelve vidrio con el nombre, y la portada sube a media velocidad */
const inicio = document.getElementById('inicio'), cab = document.getElementById('cabecera'), lp = document.querySelector('#portada .lienzo-portada');
inicio.addEventListener('scroll', () => {
  const y = inicio.scrollTop;
  cab.classList.toggle('solida', y > 250);
  if (y < 520) lp.style.transform = `translate3d(0, ${y * .45}px, 0)`;
}, { passive: true });
let ancho = innerWidth; addEventListener('resize', () => { if (innerWidth !== ancho) { ancho = innerWidth; pintarPortada(porSlug(estado.mia)); } });

saludar();
if (estado.claro) tema(true); else { renderPortada(); renderListas(); }
document.fonts && document.fonts.ready.then(() => pintarPortada(porSlug(estado.mia)));
</script>
</body>
</html>
