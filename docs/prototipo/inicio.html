<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mapa de Pensum · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..600&family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
/* Minimalista: fondo plano, una superficie, una acción. El color de la carrera solo en su icono y su barra. */
:root {
  --fondo: #000000; --superficie: #141416; --linea: rgb(255 255 255 / .07);
  --tinta: #F5F5F7; --tenue: #8E8E93; --apagada: #48484A;
  --display: 'Jost', 'Avenir Next', system-ui, sans-serif;
  --texto: 'Inter', system-ui, -apple-system, Roboto, sans-serif;
  --resorte: cubic-bezier(.2, .9, .25, 1.1);
  color-scheme: dark;
}
.app.claro { --fondo: #F2F2F7; --superficie: #FFFFFF; --linea: rgb(0 0 0 / .07); --tinta: #000000; --tenue: #6E6E73; --apagada: #C7C7CC; color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #000; }
body { font-family: var(--texto); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--tenue); outline-offset: 3px; }

.escena { height: 100%; display: grid; place-items: center; background: #0a0a0b; }
.app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--fondo); color: var(--tinta); transition: background-color .3s; }
@media (min-width: 560px) { .app { width: 390px; height: min(844px, calc(100% - 48px)); border-radius: 48px; box-shadow: 0 0 0 10px #161618, 0 30px 60px -20px rgb(0 0 0 / .8); } }
.vista { position: absolute; inset: 0; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 112px); scrollbar-width: none; }
.vista::-webkit-scrollbar { display: none; }
.vista[hidden] { display: none; }

.ph { width: var(--s, 22px); height: var(--s, 22px); display: block; flex: none; }
.nota { font: 400 13px/18px var(--texto); color: var(--tenue); font-variant-numeric: tabular-nums; }
.rot { font: 500 13px/18px var(--texto); color: var(--tenue); padding: 0 4px 8px; }
.pulsable { transition: transform .3s var(--resorte), opacity .2s; }
.pulsable:active { transform: scale(.97); opacity: .85; transition-duration: .1s; }

/* Cabecera */
.cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; }
.cabecera h1 { font: 300 32px/36px var(--display); letter-spacing: -.02em; }
.circulo { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--superficie); flex: none; --s: 20px; }

/* Tu carrera */
.tarjeta { margin-top: 24px; padding: 20px; border-radius: 24px; background: var(--superficie); }
.ident { display: flex; align-items: center; gap: 12px; }
.icono { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--k); background: color-mix(in srgb, var(--k) 14%, transparent); flex: none; }
.ident b { display: block; font: 500 17px/22px var(--texto); letter-spacing: -.015em; }
.grande { font: 200 64px/1 var(--texto); font-variation-settings: 'opsz' 32; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 28px; }
.grande small { font-size: 24px; font-weight: 300; color: var(--tenue); letter-spacing: 0; margin-left: 2px; }
.barra { height: 4px; border-radius: 2px; background: var(--linea); margin-top: 16px; overflow: hidden; }
.barra i { display: block; height: 100%; width: var(--p); border-radius: 2px; background: var(--k); transform-origin: left; animation: llena .9s cubic-bezier(.2, .8, .2, 1) .15s backwards; }
@keyframes llena { from { transform: scaleX(0); } }
.boton { width: 100%; height: 52px; border-radius: 26px; display: grid; place-items: center; margin-top: 24px; font: 500 16px/20px var(--texto); letter-spacing: -.01em; background: var(--tinta); color: var(--fondo); text-align: center; }
.boton.sec { background: transparent; color: var(--tinta); margin-top: 8px; }

/* Lista */
.seccion { margin-top: 32px; }
.lista { border-radius: 20px; background: var(--superficie); overflow: hidden; }
.fila { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 12px; position: relative; }
.fila:active { background: var(--linea); }
.fila + .fila::before { content: ''; position: absolute; top: 0; left: 62px; right: 0; height: 1px; background: var(--linea); }
.fila .icono { width: 36px; height: 36px; border-radius: 10px; --s: 20px; }
.fila .nm { flex: 1; min-width: 0; font: 400 16px/20px var(--texto); letter-spacing: -.012em; }
.fila > .ph:last-child { color: var(--apagada); --s: 16px; }

/* Ficha */
.atras { margin-bottom: 28px; }
.ficha-nombre { font: 300 34px/38px var(--display); letter-spacing: -.02em; margin-top: 20px; text-wrap: balance; }
.datos { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 24px; padding: 18px 0; border-radius: 20px; background: var(--superficie); }
.datos > div { padding: 0 18px; }
.datos > div + div { border-left: 1px solid var(--linea); }
.datos b { display: block; font: 300 26px/30px var(--texto); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* Barra inferior */
.barra-inf { position: absolute; z-index: 10; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); display: flex; padding: 4px; border-radius: 30px; background: color-mix(in srgb, var(--superficie) 82%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 0 0 1px var(--linea), 0 10px 30px -10px rgb(0 0 0 / .5); transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .25s; }
.barra-inf.oculta { transform: translate(-50%, 140%); opacity: 0; }
.pestana { width: 72px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 500 10.5px/12px var(--texto); color: var(--tenue); text-align: center; transition: background-color .25s, color .25s; }
.pestana.on { color: var(--tinta); background: var(--linea); }

/* Ajustes y aviso */
.velo { position: absolute; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); opacity: 0; pointer-events: none; transition: opacity .3s; }
.velo.on { opacity: 1; pointer-events: auto; }
.hoja { position: absolute; z-index: 21; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); padding: 22px 16px 16px; border-radius: 28px; background: var(--superficie); transform: translateY(115%); transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
.hoja.on { transform: none; }
.hoja h2 { font: 300 24px/28px var(--display); padding: 0 4px 16px; }
.segmento { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--fondo); }
.segmento button { height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px/18px var(--texto); color: var(--tenue); --s: 18px; }
.segmento button[aria-pressed="true"] { background: var(--superficie); color: var(--tinta); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
.aviso { position: absolute; z-index: 30; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translate(-50%, 12px); opacity: 0; padding: 10px 16px; border-radius: 20px; background: var(--tinta); color: var(--fondo); font: 500 14px/18px var(--texto); white-space: nowrap; transition: transform .3s var(--resorte), opacity .2s; pointer-events: none; }
.aviso.on { transform: translate(-50%, 0); opacity: 1; }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>

const ico = (n, s) => `<svg class="ph" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"${s ? ` style="--s:${s}px"` : ''}>${PH[n]}</svg>`;
const CARRERAS = [
  { slug: 'sistemas', corto: 'Sistemas', nombre: 'Ingeniería de Sistemas', tipo: 'Ingeniería', osc: '#6094ff', cla: '#2751cc', ic: 'cpu', mat: 49, uc: 132 },
  { slug: 'agronomica', corto: 'Agronómica', nombre: 'Ingeniería Agronómica', tipo: 'Ingeniería', osc: '#3fcb74', cla: '#1b7a44', ic: 'grains', mat: 58, uc: 150 },
  { slug: 'ambiental', corto: 'Ambiental', nombre: 'Ingeniería Ambiental', tipo: 'Ingeniería', osc: '#34c6ea', cla: '#0b7391', ic: 'tree', mat: 55, uc: 153 },
  { slug: 'petroleo', corto: 'Petróleo', nombre: 'Ingeniería de Petróleo', tipo: 'Ingeniería', osc: '#e8a33d', cla: '#9a6410', ic: 'drop-half-bottom', mat: 53, uc: 150 },
  { slug: 'animal', corto: 'Producción Animal', nombre: 'Ingeniería en Producción Animal', tipo: 'Ingeniería', osc: '#a9c23f', cla: '#5f7a16', ic: 'cow', mat: 60, uc: 160 },
  { slug: 'administracion', corto: 'Administración', nombre: 'Licenciatura en Administración', tipo: 'Licenciatura', osc: '#8a7cf0', cla: '#4b3bc4', ic: 'presentation-chart', mat: 56, uc: 155 },
  { slug: 'contaduria', corto: 'Contaduría', nombre: 'Licenciatura en Contaduría Pública', tipo: 'Licenciatura', osc: '#2fd3c0', cla: '#0a8577', ic: 'calculator', mat: 56, uc: 155 },
  { slug: 'alimentos', corto: 'Alimentos', nombre: 'Licenciatura en Tecnología de los Alimentos', tipo: 'Licenciatura', osc: '#ff7a6b', cla: '#c03a2b', ic: 'flask', mat: 45, uc: 140 },
  { slug: 'rrhh', corto: 'Recursos Humanos', nombre: 'Gerencia de Recursos Humanos', tipo: 'Licenciatura', osc: '#f072b0', cla: '#b32c74', ic: 'users-three', mat: 49, uc: 149 },
];
const k = s => CARRERAS.find(c => c.slug === s);
const app = document.getElementById('app');
const estado = { mia: 'sistemas', claro: false, abierta: null };
try { Object.assign(estado, JSON.parse(localStorage.getItem('mp-mini') || '{}')); } catch (e) {}
const guardar = () => { try { localStorage.setItem('mp-mini', JSON.stringify({ mia: estado.mia, claro: estado.claro })); } catch (e) {} };
const color = c => estado.claro ? c.cla : c.osc;
const toque = () => { try { navigator.vibrate && navigator.vibrate(6); } catch (e) {} };
const pasar = f => (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) ? document.startViewTransition(f) : f();

function pintar() {
  const h = new Date().getHours();
  document.getElementById('saludo').textContent = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const c = k(estado.mia), ejemplo = c.slug === 'sistemas';
  document.getElementById('mia').innerHTML = `<button class="tarjeta pulsable" style="--k:${color(c)};display:block;width:100%" data-slug="${c.slug}">
    <div class="ident"><span class="icono">${ico(c.ic)}</span><div><b>${c.corto}</b><span class="nota">${c.tipo}</span></div></div>
    <div class="grande">${ejemplo ? 41 : 0}<small>%</small></div>
    <div class="nota" style="margin-top:8px">${ejemplo ? 'Semestre 5 de 10 · terminas en Dic 2029' : 'Marca lo que ya aprobaste'}</div>
    <div class="barra"><i style="--p:${ejemplo ? 41 : 0}%"></i></div>
    <span class="boton" data-aviso="${ejemplo ? 'Abre tu mapa donde lo dejaste' : 'Abre tu mapa para empezar'}">${ejemplo ? 'Seguir donde ibas' : 'Empezar'}</span>
  </button>`;
  document.getElementById('lista').innerHTML = CARRERAS.filter(c => c.slug !== estado.mia).map(c =>
    `<button class="fila" data-slug="${c.slug}" style="--k:${color(c)}"><span class="icono">${ico(c.ic)}</span><span class="nm">${c.corto}</span>${ico('caret-right')}</button>`).join('');
}
function ficha(c) {
  const f = document.getElementById('ficha'), mia = c.slug === estado.mia;
  f.style.setProperty('--k', color(c));
  f.innerHTML = `<button class="circulo pulsable atras" id="volver" aria-label="Volver">${ico('caret-left')}</button>
    <span class="icono" style="width:56px;height:56px;border-radius:16px;--s:30px">${ico(c.ic)}</span>
    <h1 class="ficha-nombre">${c.corto}</h1>
    <p class="nota" style="font-size:15px;line-height:20px;margin-top:4px">${c.nombre}</p>
    <div class="datos"><div><b>${c.mat}</b><span class="nota">Materias</span></div><div><b>${c.uc}</b><span class="nota">UC</span></div><div><b>10</b><span class="nota">Semestres</span></div></div>
    <button class="boton pulsable" data-aviso="Abre el mapa de ${c.corto}">Ver el mapa</button>
    ${mia ? '' : '<button class="boton sec pulsable" id="hacer-mia">Hacerla mi carrera</button>'}`;
}
function ir(vista) {
  pasar(() => {
    document.getElementById('inicio').hidden = vista !== 'inicio';
    document.getElementById('ficha').hidden = vista !== 'ficha';
    document.getElementById('barra').classList.toggle('oculta', vista !== 'inicio');
    document.getElementById(vista).scrollTop = 0;
  });
}
let reloj;
function avisar(t) { const a = document.getElementById('aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(reloj); reloj = setTimeout(() => a.classList.remove('on'), 1700); }
function hoja(on) { document.getElementById('hoja').classList.toggle('on', on); document.getElementById('velo').classList.toggle('on', on); }
function tema(claro) {
  estado.claro = claro; guardar(); app.classList.toggle('claro', claro);
  document.querySelector('meta[name="theme-color"]').content = claro ? '#F2F2F7' : '#000000';
  document.getElementById('oscuro').setAttribute('aria-pressed', !claro);
  document.getElementById('claro').setAttribute('aria-pressed', claro);
  pintar(); if (estado.abierta) ficha(k(estado.abierta));
}

document.addEventListener('click', e => {
  const av = e.target.closest('[data-aviso]'); if (av) { e.stopPropagation(); toque(); return avisar(av.dataset.aviso); }
  const s = e.target.closest('[data-slug]'); if (s) { toque(); estado.abierta = s.dataset.slug; ficha(k(s.dataset.slug)); return ir('ficha'); }
  if (e.target.closest('#volver')) { toque(); estado.abierta = null; return ir('inicio'); }
  if (e.target.closest('#hacer-mia')) { toque(); estado.mia = estado.abierta; estado.abierta = null; guardar(); pintar(); ir('inicio'); return avisar('Ahora es tu carrera'); }
  const p = e.target.closest('.pestana');
  if (p) {
    toque();
    document.querySelectorAll('.pestana').forEach(x => { const on = x === p; x.classList.toggle('on', on); x.querySelector('svg').outerHTML = ico(on ? x.dataset.ic + ':fill' : x.dataset.ic); });
    if (p.dataset.ic !== 'house') { avisar(p.textContent.trim() + ', en la app'); setTimeout(() => document.querySelector('.pestana[data-ic="house"]').click(), 1200); }
  }
});
document.getElementById('ajustes').onclick = () => { toque(); hoja(true); };
document.getElementById('velo').onclick = () => hoja(false);
document.getElementById('oscuro').onclick = () => tema(false);
document.getElementById('claro').onclick = () => tema(true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hoja(false); });
estado.claro ? tema(true) : pintar();
</script>
