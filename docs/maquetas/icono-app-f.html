<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Icono de la app · paradas finas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E6E7E9;font-family:system-ui,sans-serif;padding:48px;color:#050608}
h1{font-weight:300;font-size:36px;letter-spacing:-.01em}
p{font-size:15px;line-height:22px;color:#34383E;margin-top:10px;max-width:940px}
.rej{display:grid;grid-template-columns:repeat(3,300px);gap:44px 40px;margin-top:40px}
.op h3{font-size:15px;font-weight:600;margin-bottom:4px}
.op p{font-size:13px;line-height:18px;margin:0 0 14px;min-height:54px}
.grande svg{width:300px;height:300px;display:block;border-radius:68px;box-shadow:0 24px 48px -20px rgb(0 0 0/.45)}
.tira{display:flex;gap:16px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#27364f,#5a4a6b)}
.tira svg{border-radius:23%;display:block}
</style></head><body>
<h1>Icono de la app · Paradas, en seis estilos finos</h1>
<p>El mismo mapa y la misma ruta de la opción «Paradas». Solo cambia cómo se dibujan la línea y las paradas. Debajo de cada uno, a 64 y 48 px.</p>
<div class="rej" id="rej"></div>
<script>
let n=0;const AZ='#2751CC',CL='#6699FF',TI='#14171D';
const C=[[166,326],[256,256],[346,186]];
const linea=`M${C[0][0]} ${C[0][1]}H${C[0][0]+10}L${C[1][0]-10} ${C[1][1]}H${C[1][0]+10}L${C[2][0]-10} ${C[2][1]}H${C[2][0]}`;
function icono(v,t){const k='f'+(n++);
 return `<svg viewBox="0 0 512 512" ${t?`width="${t}" height="${t}"`:''}><defs>
 <linearGradient id="f${k}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d2026"/><stop offset="1" stop-color="#040405"/></linearGradient>
 <radialGradient id="l${k}" cx=".5" cy="0" r=".9"><stop stop-color="#6699FF" stop-opacity=".24"/><stop offset="1" stop-color="#6699FF" stop-opacity="0"/></radialGradient>
 <linearGradient id="a${k}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EDF3"/></linearGradient>
 <linearGradient id="b${k}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D5DAE3"/><stop offset="1" stop-color="#BFC6D2"/></linearGradient>
 <linearGradient id="r${k}" gradientUnits="userSpaceOnUse" x1="166" y1="326" x2="346" y2="186"><stop stop-color="#1F3FA6"/><stop offset="1" stop-color="${CL}"/></linearGradient>
 <filter id="s${k}" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter></defs>
 <rect width="512" height="512" fill="url(#f${k})"/><rect width="512" height="512" fill="url(#l${k})"/>
 <g filter="url(#s${k})" stroke-linejoin="round" stroke-width="14">
  <path d="M116 158 206 124V362L116 396Z" fill="url(#a${k})" stroke="url(#a${k})"/>
  <path d="M206 124 306 158V396L206 362Z" fill="url(#b${k})" stroke="url(#b${k})"/>
  <path d="M306 158 396 124V362L306 396Z" fill="url(#a${k})" stroke="url(#a${k})"/></g>
 ${v(k)}</svg>`;}
const cable=(col,g)=>`<path d="${linea}" fill="none" stroke="${col}" stroke-width="${g}" stroke-linecap="round" stroke-linejoin="round"/>`;
const aro=([x,y],r,g,col,rel='#fff')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${rel}" stroke="${col}" stroke-width="${g}"/>`;
const pt=([x,y],r,col)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`;
const OPS=[
 ['1 · Hilo','Línea fina y paradas como aros delgados. La meta, rellena. La más ligera.',
  k=>cable(AZ,6)+aro(C[0],12,5,AZ)+aro(C[1],12,5,AZ)+pt(C[2],16,AZ)],
 ['2 · Puntos y diana','Paradas como puntos pequeños y la meta como una diana: un aro fino con su centro.',
  k=>cable(AZ,5)+pt(C[0],9,AZ)+pt(C[1],9,AZ)+aro(C[2],19,5,AZ)+pt(C[2],7,AZ)],
 ['3 · Tinta','Todo en tinta casi negra y fina; solo la meta en azul. Muy sobria, casi de papelería.',
  k=>cable(TI,5)+aro(C[0],11,5,TI)+aro(C[1],11,5,TI)+pt(C[2],16,AZ)],
 ['4 · Degradado','El hilo pasa de azul profundo a azul claro, y la meta lleva un segundo aro fino alrededor, como un pulso.',
  k=>cable(`url(#r${k})`,6)+aro(C[0],11,5,'#1F3FA6')+aro(C[1],11,5,'#3D68E8')+pt(C[2],13,CL)+`<circle cx="${C[2][0]}" cy="${C[2][1]}" r="25" fill="none" stroke="${CL}" stroke-width="3.5" opacity=".7"/>`],
 ['5 · Metro','Como en Mini Metro: paradas blancas con contorno oscuro sobre la línea azul, y un tope en T donde empieza.',
  k=>cable(AZ,8)+`<path d="M${C[0][0]-22} ${C[0][1]-13}V${C[0][1]+13}" stroke="${AZ}" stroke-width="8" stroke-linecap="round"/><path d="M${C[0][0]-22} ${C[0][1]}H${C[0][0]}" stroke="${AZ}" stroke-width="8"/>`+aro(C[0],11,5,TI)+aro(C[1],11,5,TI)+aro(C[2],14,5,TI,AZ)],
 ['6 · Formas','Cada parada con una forma distinta —círculo, triángulo y cuadrado—, en trazo fino. Un guiño más directo al juego.',
  k=>cable(AZ,6)+aro(C[0],12,5,AZ)+`<path d="M${C[1][0]} ${C[1][1]-15}L${C[1][0]+15} ${C[1][1]+11}H${C[1][0]-15}Z" fill="#fff" stroke="${AZ}" stroke-width="5" stroke-linejoin="round"/>`+`<rect x="${C[2][0]-14}" y="${C[2][1]-14}" width="28" height="28" rx="5" fill="${AZ}"/>`],
];
document.getElementById('rej').innerHTML=OPS.map(([t,p,v])=>`<div class="op"><h3>${t}</h3><p>${p}</p><div class="grande">${icono(v)}</div><div class="tira">${icono(v,64)}${icono(v,48)}</div></div>`).join('');
</script></body></html>
